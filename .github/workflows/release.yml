name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  TARGETS: api agent-api web

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - name: Require public web config
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$PUBLIC_WEB_ORIGIN" ] || [ -z "$PUBLIC_API_BASE_URL" ]; then
            echo "::error::Set repository variables PUBLIC_WEB_ORIGIN and PUBLIC_API_BASE_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every image builds before any is pushed, so a failed build cannot leave
      # latest pointing at a mix of old and new apps. The push pass reuses the
      # builder's local cache from the build pass, so it does not rebuild.
      - name: Build images
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          for target in $TARGETS; do
            docker buildx build . --target "$target" \
              --build-arg WEB_ORIGIN="$PUBLIC_WEB_ORIGIN" \
              --build-arg VITE_API_BASE_URL="$PUBLIC_API_BASE_URL"
          done
      - name: Push images
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          # ghcr.io rejects uppercase image names.
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for target in $TARGETS; do
            image="$repository-$target"
            docker buildx build . --target "$target" --push \
              --build-arg WEB_ORIGIN="$PUBLIC_WEB_ORIGIN" \
              --build-arg VITE_API_BASE_URL="$PUBLIC_API_BASE_URL" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image:$version" \
              --tag "$image:$minor" \
              --tag "$image:$major" \
              --tag "$image:latest"
          done
