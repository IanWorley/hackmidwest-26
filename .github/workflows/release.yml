name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ${{ matrix.target }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, agent-api, web]
    steps:
      # Checked in every leg, not only web, so missing config cannot publish a partial release.
      - name: Require public web config
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$PUBLIC_WEB_ORIGIN" ] || [ -z "$PUBLIC_API_BASE_URL" ]; then
            echo "::error::Set repository variables PUBLIC_WEB_ORIGIN and PUBLIC_API_BASE_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action lowercases the image name, which ghcr.io requires.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WEB_ORIGIN=${{ vars.PUBLIC_WEB_ORIGIN }}
            VITE_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
