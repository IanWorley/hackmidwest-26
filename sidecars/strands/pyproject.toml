[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackmidwest-strands"
version = "0.1.0"
description = "Read-only Strands agent over the Hack Midwest agent API"
requires-python = ">=3.12"
dependencies = [
  "strands-agents[openai]==1.59.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
